{% extends "base.html" %}
{% block title %}Sign In | VASK MedCare{% endblock %}
{% block content %}
<section class="auth-card">
    <div class="section-title">
        <p class="eyebrow">Access Portal</p>
        <h2>Sign in</h2>
    </div>
    <form method="post" class="form-grid">
        <label>
            <span>Phone</span>
            <input type="text" name="phone" placeholder="Enter phone number">
        </label>
        <label>
            <span>Password</span>
            <input type="password" name="password" placeholder="Enter password">
        </label>
        <button type="submit" class="btn btn-primary">Open dashboard</button>
    </form>
    <p class="muted">Default admin login: <code>9999999999</code> / <code>admin123</code>.</p>
    <a href="{{ url_for('register') }}" class="text-link">Create a patient account</a>
</section>
{% endblock %}
