<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='commmon.css') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='dashy.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='chat.css') }}">
</head>
<body>

<div class="dashboard-wrapper">

    <!-- HEADER -->
    <div class="top-bar">
        <h1>🩺 AI Health Intelligence</h1>
        <span class="status">● Online</span>
    </div>

    <!-- GRID -->
    <div class="dashboard-grid">

        <!-- RISK CARD -->
        <div class="card risk-card">
            <h3>⚠️ Risk Score</h3>

            <div class="progress-circle">
                <span id="riskValue">0</span>
            </div>

            <p class="risk-text">Unknown</p>
        </div>

        <!-- SUMMARY -->
        <div class="card">
            <h3>📊 Summary</h3>
            <p id="summaryText">Run analysis to see results</p>
        </div>

        <!-- UPLOAD -->
        <div class="card upload-card">
            <h3>📂 Upload Medical Report</h3>

            <form id="uploadForm">
                <label class="file-upload">
                    <input type="file" id="file" required>
                    <span>Choose PDF</span>
                </label>

                <button type="submit">Run AI Analysis</button>
            </form>

            <pre id="result"></pre>

            <a class="chat-link" href="/chat_page">💬 Open Full Chat</a>
        </div>

    </div>

</div>

<!-- FLOAT CHAT BUTTON -->
<div id="chat-btn">💬</div>

<!-- CHAT POPUP -->
<div id="chat-popup">
    <div class="chat-header">
        AI Assistant 
        <span onclick="toggleChat()">✖</span>
    </div>

    <div id="chat-body"></div>

    <div class="chat-input">
        <input id="msg" placeholder="Ask health question...">
        <button onclick="send()">➤</button>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
